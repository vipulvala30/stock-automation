name: Run Stock Script

on:
  workflow_dispatch:   # ✅ Manual run only (SAFE)
  schedule:
    - cron: "0 13 * * *"   # 6:30 PM IST (keep for later)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install libraries
        run: |
          pip install pandas yfinance gspread oauth2client requests scikit-learn

      - name: Run script
        run: python test.py
